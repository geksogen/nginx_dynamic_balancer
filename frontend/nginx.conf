server {
    listen 80;

    # Указываем IP-адрес внутреннего DNS-сервера Docker.
    # valid=2s заставляет Nginx сбрасывать кэш DNS каждые 2 секунды.
    resolver 127.0.0.11 valid=2s;

    # Первая функция: отдавать "hello" по корневому эндпоинту
    location = / {
        default_type text/plain;
        return 200 'Hello! This is the frontend Nginx proxy.\n';
    }

    # Вторая функция: проксировать запросы в backend
    location /backend {
        # Использование переменной ($upstream) заставляет Nginx разрешать
        # DNS-имя при КАЖДОМ запросе (с учетом кэша valid=2s),
        # что позволяет динамически видеть новые контейнеры при скейлинге.
        set $upstream http://backend:8080;

        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}